<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Computer Aided Design Technology — Employer Form</title>
<meta name="description" content="Employer support form for the Computer Aided Design Technology program — a collaboration between TechMind Innovators and Sprott Shaw College.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>

  :root {
    --bc-blue: #234075; --bc-gold: #e3a82b;
    --ink: #1a1a1a; --muted: #5b6472;
    --line: #d4d9e0; --line-strong: #9aa3b0;
    --bg: #f4f6f9; --card: #ffffff;
    --subtle: #fafbfc; --subtle-2: #f7f9fc;
    --note-bg: #f0f4fb; --note-border: #d7e1f2; --note-ink: #2b3a57;
    --header-ink: #ffffff;
    --good: #1f8a4c; --good-bg: #ecf8f0;
    --warn: #b4690e; --warn-bg: #fdf3e6;
    --bad: #b42318; --bad-bg: #fdeceb;
    --accent: #234075; --accent-ink: #2d508f; --focus: rgba(35,64,117,.14);
    --radius: 10px;
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --ink:#e8ecf2; --muted:#9aa5b5; --line:#313a47; --line-strong:#4a5564;
    --bg:#11151b; --card:#1a202a; --subtle:#1f2630; --subtle-2:#202834;
    --note-bg:#1b2534; --note-border:#2b3c54; --note-ink:#bcd0ee;
    --good:#4cc47d; --good-bg:#16281d; --warn:#e0a243; --warn-bg:#2a2114;
    --bad:#f0786b; --bad-bg:#2c1817;
    --accent:#7ea2dd; --accent-ink:#9bb8e8; --focus:rgba(126,162,221,.24);
    --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }}
  :root[data-theme="dark"]{
    --ink:#e8ecf2; --muted:#9aa5b5; --line:#313a47; --line-strong:#4a5564;
    --bg:#11151b; --card:#1a202a; --subtle:#1f2630; --subtle-2:#202834;
    --note-bg:#1b2534; --note-border:#2b3c54; --note-ink:#bcd0ee;
    --good:#4cc47d; --good-bg:#16281d; --warn:#e0a243; --warn-bg:#2a2114;
    --bad:#f0786b; --bad-bg:#2c1817;
    --accent:#7ea2dd; --accent-ink:#9bb8e8; --focus:rgba(126,162,221,.24);
    --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink); background: var(--bg); line-height: 1.5; font-size: 16px;
    -webkit-text-size-adjust: 100%;
  }
  img { max-width: 100%; }

  .topbar { background: var(--bc-blue); color: var(--header-ink); border-bottom: 4px solid var(--bc-gold); }
  .topbar-inner { max-width: 760px; margin: 0 auto; padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
  .crest { width: 40px; height: 40px; flex: none; border-radius: 6px; background: #fff; display: grid; place-items: center; }
  .crest svg { width: 32px; height: 32px; display: block; }
  .topbar h1 { font-size: 1rem; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .topbar p { margin: 2px 0 0; font-size: .8rem; opacity: .88; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 22px 20px 220px; }

  .intro { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); margin-bottom: 20px; }
  .intro-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .intro-badge { font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-ink); background: var(--note-bg); border: 1px solid var(--note-border); border-radius: 99px; padding: 3px 10px; }
  .intro-time { font-size: .82rem; color: var(--muted); font-weight: 500; }
  .intro h2 { margin: 0 0 6px; font-size: 1.12rem; text-wrap: balance; }
  .collab { font-size: .9rem; color: var(--muted); margin: 0 0 12px; }
  .collab strong { color: var(--accent-ink); }
  .intro .goal { margin: 0 0 14px; font-size: .95rem; }
  .note { border-radius: 8px; padding: 12px 15px; font-size: .9rem; margin-top: 4px; }
  .note.reassure { background: var(--good-bg); border: 1px solid var(--good); color: var(--ink); }
  .note.reassure .pill { display:inline-block; font-weight:700; color: var(--good); font-size:.76rem; letter-spacing:.04em; text-transform:uppercase; margin-bottom:4px; }

  .baked { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0 0; padding: 12px 15px; background: var(--subtle-2); border: 1px solid var(--line); border-radius: 8px; font-size: .88rem; }
  .baked dt { color: var(--muted); font-weight: 500; }
  .baked dd { margin: 0; font-weight: 600; }

  .progress-wrap { margin-top: 18px; }
  .progress-label { font-size: .8rem; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .progress-track { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--bc-blue); border-radius: 99px; transition: width .3s ease; }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .progress-fill { background: var(--accent); } }
  :root[data-theme="dark"] .progress-fill { background: var(--accent); }

  .section { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
  .section-head { padding: 13px 20px; border-bottom: 1px solid var(--line); background: var(--subtle); }
  .section-head h3 { margin: 0; font-size: .98rem; color: var(--accent-ink); }
  .section-body { padding: 18px 20px; }

  .field { margin-bottom: 20px; }
  .field:last-child { margin-bottom: 0; }
  label.q { display: block; font-weight: 600; font-size: .95rem; margin-bottom: 3px; }
  label.q .num { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--bc-blue); color: #fff; font-size: .76rem; font-weight: 700; margin-right: 8px; vertical-align: middle; }
  .req { color: var(--bad); font-weight: 700; }
  .opt { color: var(--muted); font-weight: 500; font-size: .82rem; }
  .hint { font-size: .85rem; color: var(--muted); margin: 2px 0 9px; }

  input[type=text], input[type=email], input[type=tel], input[type=date], textarea {
    width: 100%; font: inherit; font-size: .95rem; padding: 10px 12px;
    border: 1.5px solid var(--line-strong); border-radius: 8px; background: var(--card); color: var(--ink);
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); opacity: .7; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  textarea { resize: vertical; min-height: 84px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 520px){ .row2 { grid-template-columns: 1fr; } }

  /* suggestions */
  .suggests { margin-top: 9px; display: flex; flex-direction: column; gap: 7px; }
  .suggests-label { font-size: .78rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
  .suggest { text-align: left; font: inherit; font-size: .86rem; line-height: 1.45; color: var(--ink);
    background: var(--subtle-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px 9px 34px; cursor: pointer; position: relative; transition: border-color .15s, background .15s; }
  .suggest:hover { border-color: var(--accent); }
  .suggest::before { content: "+"; position: absolute; left: 12px; top: 8px; font-weight: 700; color: var(--accent-ink); font-size: 1rem; line-height: 1.2; }
  .suggest .cap { display:block; font-size:.72rem; color: var(--muted); margin-top: 3px; }

  /* roles checklist */
  .roles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 520px){ .roles { grid-template-columns: 1fr; } }
  .role { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1.5px solid var(--line-strong); border-radius: 8px; cursor: pointer; font-size: .9rem; transition: border-color .15s, background .15s; }
  .role:hover { border-color: var(--accent); }
  .role input { width: 17px; height: 17px; accent-color: var(--bc-blue); flex: none; }
  .role.checked { border-color: var(--accent); background: var(--note-bg); }
  .roles-other { margin-top: 12px; }
  .roles-other-label { display: block; font-size: .85rem; font-weight: 500; margin-bottom: 5px; color: var(--ink); }
  .roles-other textarea { min-height: 54px; }

  /* role + counter grid (Question 2) */
  .rg-rows { display: flex; flex-direction: column; gap: 8px; }
  .rg-row { display: flex; align-items: center; gap: 10px; }
  .rg-name { flex: 1 1 auto; min-width: 0; font-size: .92rem; }
  .rg-name.rg-fixed { padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--subtle); }
  input.rg-name { padding: 9px 12px; border: 1.5px dashed var(--line-strong); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; font-size: .92rem; }
  input.rg-name:focus { outline: none; border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .rg-step { flex: 0 0 auto; }
  .rg-step button { width: 38px; height: 40px; }
  .rg-step input { width: 52px; }
  .rg-none { display: flex; align-items: center; gap: 9px; margin-top: 12px; font-size: .9rem; cursor: pointer; }
  .rg-none input { width: 17px; height: 17px; accent-color: var(--bc-blue); flex: none; }
  .rg-answer-wrap { margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .rg-answer-label { font-size: .82rem; font-weight: 600; color: var(--accent-ink); margin-bottom: 6px; }
  .rg-answer { width: 100%; font: inherit; font-size: .95rem; padding: 10px 12px; border: 1.5px solid var(--line-strong); border-radius: 8px; background: var(--card); color: var(--ink); resize: vertical; min-height: 74px; }
  .rg-answer:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }
  .rg-regen { margin-top: 9px; background: var(--card); border: 1.5px solid var(--line-strong); color: var(--accent-ink); font: inherit; font-size: .84rem; font-weight: 600; cursor: pointer; padding: 7px 14px; border-radius: 99px; display: inline-flex; align-items: center; gap: 5px; }
  .rg-regen:hover { border-color: var(--accent); background: var(--subtle); }

  /* source checklist (Question 3) */
  .src-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (max-width: 520px){ .src-list { grid-template-columns: 1fr; } }
  .src-item { display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1.5px solid var(--line-strong); border-radius: 8px; cursor: pointer; font-size: .9rem; transition: border-color .15s, background .15s; }
  .src-item:hover { border-color: var(--accent); }
  .src-item input { width: 17px; height: 17px; accent-color: var(--bc-blue); flex: none; }
  .src-item.checked { border-color: var(--accent); background: var(--note-bg); }
  .src-custom-rows { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  input.src-custom { width: 100%; padding: 9px 12px; border: 1.5px dashed var(--line-strong); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; font-size: .9rem; }
  input.src-custom:focus { outline: none; border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 3px var(--focus); }

  /* single count + answer (Question 5) */
  .ca-row { display: flex; align-items: center; gap: 10px; }

  /* number stepper */
  .stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
  .stepper button { font: inherit; font-size: 1.1rem; width: 42px; height: 42px; border: none; background: var(--subtle); color: var(--ink); cursor: pointer; }
  .stepper button:hover { background: var(--line); }
  .stepper input { width: 64px; text-align: center; border: none; border-left: 1.5px solid var(--line-strong); border-right: 1.5px solid var(--line-strong); border-radius: 0; font-size: 1rem; -moz-appearance: textfield; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper-unit { margin-left: 10px; color: var(--muted); font-size: .9rem; }

  /* practicum (radio yes/no + conditional) */
  .yesno { display: flex; gap: 10px; margin-bottom: 10px; }
  .yesno label { flex: 1; text-align: center; padding: 9px; border: 1.5px solid var(--line-strong); border-radius: 8px; cursor: pointer; font-size: .9rem; font-weight: 500; }
  .yesno input { position: absolute; opacity: 0; pointer-events: none; }
  .yesno label.sel { border-color: var(--accent); background: var(--note-bg); color: var(--accent-ink); font-weight: 600; }
  .yesno label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

  .feedback { font-size: .82rem; margin-top: 7px; min-height: 1em; display: flex; gap: 6px; align-items: flex-start; }
  .feedback.good { color: var(--good); } .feedback.warn { color: var(--warn); } .feedback.bad { color: var(--bad); }
  .feedback svg { flex: none; margin-top: 2px; }

  .certify { display: flex; gap: 10px; align-items: flex-start; background: var(--subtle-2); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; font-size: .9rem; }
  .certify input { margin-top: 3px; width: 18px; height: 18px; flex: none; accent-color: var(--bc-blue); }

  .actionbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); box-shadow: 0 -4px 20px rgba(16,24,40,.08); z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .actionbar-inner { max-width: 760px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .status-msg { font-size: .85rem; color: var(--muted); min-width: 0; flex: 1 1 140px; }
  .status-msg.done { color: var(--good); font-weight: 500; }
  .status-msg.err { color: var(--bad); font-weight: 500; }
  .btns { display: flex; gap: 10px; flex: 0 0 auto; }
  @media (max-width: 420px){
    .actionbar-inner { padding: 10px 16px; }
    .btns { flex: 1 1 100%; }
    .btns button { flex: 1; }
    button.primary, button.ghost { padding: 11px 12px; }
  }
  button.primary, button.ghost { font: inherit; font-weight: 600; font-size: .92rem; padding: 11px 18px; border-radius: 8px; cursor: pointer; border: 1.5px solid transparent; }
  button.primary { background: var(--bc-blue); color: #fff; }
  button.primary:hover { background: #1b3460; }
  /* muted until the form is complete; still clickable so it can guide the user to what's missing */
  button.primary[aria-disabled="true"] { opacity: .5; }
  button.primary.is-ready { opacity: 1; }
  button.ghost { background: var(--card); color: var(--accent-ink); border-color: var(--line-strong); }
  button.ghost:hover { background: var(--subtle); }

  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* iOS zooms the page when a focused input is <16px; force 16px on small screens */
  @media (max-width: 640px){
    input[type=text], input[type=email], input[type=tel], input[type=date], textarea,
    input.rg-name, input.src-custom, .rg-answer, .stepper input, .rg-step input, .ca-step input, .pr-step input { font-size: 16px; }
  }
  .footnote { text-align: center; color: var(--muted); font-size: .78rem; margin-top: 24px; }
  .field.invalid input, .field.invalid textarea { border-color: var(--bad); }
  @media (prefers-reduced-motion: reduce){ * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }

</style>
</head>

      <svg viewBox="0 0 48 48" fill="none">

<script id="program-config" type="application/json">{"college":"Sprott Shaw College","programTitle":"Computer Aided Design Technology","credential":"Computer Aided Design Technology Certificate","charityName":"TechMind Innovators","charityDescriptor":"a registered Canadian charity","intro":{"badge":"Interactive form","heading":"A quicker way to share your input","builtByHtml":"This is an interactive form built by \u003cstrong>TechMind Innovators\u003c/strong> to make answering as easy as possible — most questions draft an answer for you that you can tweak or replace.","timeEstimate":"About 5 minutes","goalHtml":"We&#39;re working to bring grant-funded \u003cstrong>Computer Aided Design Technology\u003c/strong> training to your community, in partnership with \u003cstrong>Sprott Shaw College\u003c/strong>. Your perspective helps the Province of BC see where these skills are needed most, so local people can train for careers in your industry and businesses like yours gain job-ready talent close to home. A few minutes of your insight can help build that talent pipeline."},"notCommittedNote":"Completing this form does \u003cstrong>not\u003c/strong> commit your company to hiring anyone. It gives the Province of BC a picture of real employment needs in your sector — that&#39;s all. Please answer candidly.","footerNote":"This form runs entirely in your browser — nothing you enter is sent anywhere until you choose to share the PDF. When you finish, you download a completed PDF and email it back to the person who sent you this link.","returnInstruction":"Please email the completed PDF back to the person who sent you this link.","roles":["Estimator","Project Coordinator","BIM Designer","Electrical Designer","CAD Technician","Drafter"],"questions":[{"id":"communities","type":"textarea","label":"Which community or communities does your business operate in?","hint":"Name the actual cities or regions where your crews and offices work — not just your head office. Local, specific places make the strongest case.","mapsTo":"q1"},{"id":"roleDemand","type":"rolegrid","label":"Do you currently have vacant positions that graduates of this program could fill? Set how many of each role.","hint":"Set a number beside each role you currently have open that graduates could fill. Think broadly too — roles people could grow into, or skills you wish your current team had, are worth noting. Add your own roles in the blank rows. If you have no current vacancies, tick \"No vacancies right now\" and we'll note your future interest instead.","mapsTo":"q2"},{"id":"postings","type":"sourcegrid","label":"Where do you regularly post these openings?","hint":"Tick the places you use, or add your own. We'll draft your answer below — you can edit it.","mapsTo":"q3"},{"id":"hardToFill","type":"textarea","label":"Have these positions been hard to fill in the past? If so, what made it hard?","hint":"What's made it hard to find the right people? The suggested answers below are a good starting point — pick the closest one and tweak it.","mapsTo":"q4"},{"id":"futureOpenings","type":"countanswer","label":"Do you foresee future openings in these positions over the next 6 to 12 months? If so, how many?","hint":"Set your best estimate of anticipated openings. A forward number shows the need is lasting, not a one-off. If you can't put a figure on it yet, tick \"No specific number yet\" and we'll note your future interest.","min":0,"max":50,"step":1,"unit":"anticipated openings","mapsTo":"q5"},{"id":"practicum","type":"practicum","label":"If a practicum were part of the training, could you host a student? If so, how many?","hint":"This one is purely hypothetical — this program does not actually include a placement, so you're not committing to anything. It just asks whether, in principle, you'd be open to hosting. \"No\" is a perfectly fine answer; either way we'll draft a response you can edit.","mapsTo":"q6"},{"id":"comments","type":"textarea","label":"Anything else you'd like to add?","hint":"Optional. A sentence on the skills shortage in your sector, or your intent to interview graduates, reinforces that you're a real local partner.","optional":true,"mapsTo":"q7"}],"phrasings":{"roleDemand":{"question":"Which roles could graduates of this program fill, and how many of each? (Official Q2: Do you currently have vacant positions that successful graduates of this training would be qualified to fill? Please list the names of the position(s) and how many openings.)","slot":"{roles}","positive":["Yes. We currently have openings that graduates of this training would be well qualified to fill: {roles}.","Yes — we have active vacancies that these graduates could step into, specifically {roles}.","We do have current openings well suited to graduates of this program: {roles}.","Yes. Right now we're looking to fill {roles}, and graduates of this training would be strong candidates.","We have immediate needs that this training maps directly onto: {roles}.","Yes, there are positions open with us today that graduates could fill — {roles}.","We currently have room for {roles}, and this credential is exactly the preparation we look for.","Yes. Graduates would be qualified for several roles we're hiring for now: {roles}.","We have live openings that fit this training well: {roles}.","Yes — our current vacancies include {roles}, all of which graduates of this program could take on.","At the moment we're actively trying to fill {roles}, and this is the kind of training that would prepare someone to do that work.","Yes, we have real demand right now for {roles}, and graduates of this program would be a natural fit.","We currently have openings for {roles} that we'd be glad to see qualified local graduates apply to.","Yes. These are roles we need filled today and that graduates could move into: {roles}.","We have present-day vacancies that align with this training: {roles}.","Yes — we could use {roles} right now, and this credential covers the core skills for those roles.","Our current hiring needs include {roles}, which graduates of this program would be equipped to fill.","Yes. There is genuine demand in our shop today for {roles}, and this training speaks directly to it.","We're currently short on {roles}, and graduates of this program would help us close that gap.","Yes, we have openings now for {roles} — exactly the kind of work this training prepares people for.","We have immediate openings for {roles}, and we'd welcome applications from graduates of this program.","Yes. The roles we most need filled right now — {roles} — line up closely with what this training delivers.","We currently have positions available for {roles} that graduates of this credential could fill.","Yes — there's real, present demand with us for {roles}, and this program builds exactly those skills."],"negative":["We don't have vacancies open at this exact moment, but roles like these are a regular part of our hiring, and we'd welcome qualified local graduates as our needs grow.","No immediate openings today, though this is the kind of talent we return to the market for often — graduates of this program would be on our radar as we grow.","Nothing open right now, but the skills this training builds are ones we consistently need, and we expect to be hiring for them again before long.","We're fully staffed at the moment, but we see steady demand for these skills in our sector and would be glad to consider graduates as positions come up.","No current vacancies, but we anticipate needing this kind of talent as our workload grows, and a local pipeline of graduates would be genuinely valuable to us.","Not right now — but roles like these turn over and expand for us over time, and we'd happily look at graduates of this program when they do.","We have no openings today, though we view this training as building exactly the skills our industry will keep needing, including here.","No vacancies at the moment, but we're optimistic about growth, and graduates with this credential are the kind of people we'd want to hire when we expand.","Nothing open presently, but we'd keep graduates of this program in mind — these are skills that come up regularly in our hiring.","We're not hiring for this today, but the training targets a real and recurring need in our sector, and we'd welcome local graduates down the line.","No current openings, though we expect that to change as projects ramp up — and this is precisely the skill set we'd be recruiting for.","Not at this moment, but we see this training filling a gap our industry feels broadly, and we'd be glad to consider its graduates in future.","We don't have a vacancy open today, but we hire for these skills periodically and would value a stronger local pool of qualified graduates.","No immediate need, but we're growing, and roles drawing on this training are the kind we expect to open as we do.","Nothing available right now, but the demand for these skills in our region is real, and we'd support graduates finding their footing here.","We're set for now, though we anticipate future openings in this area and would welcome graduates of this program when they arise.","No vacancies currently, but this training reflects where our sector is heading, and we'd be happy to consider graduates as our needs develop.","Not hiring for this today, but these are skills we keep coming back to, and a reliable stream of local graduates would help us plan ahead.","We have no openings at present, but we'd gladly keep in touch — graduates with this credential are exactly who we look for when roles open.","No current vacancies, but we believe in where this training is going and expect it will match real openings with us as we grow.","Nothing open just now, but we'd encourage graduates to reach out — our hiring in this area tends to come in waves, and skilled people are always welcome.","We're not recruiting for this right now, but the need is real in our industry, and we'd happily consider program graduates as future opportunities come up.","No immediate positions, though we see clear long-term demand for these skills and would value graduates joining our local talent pool.","Not at this time, but we're confident this kind of training meets a lasting need in our sector, and we'd be glad to look at its graduates as we expand."]},"postings":{"question":"Where do you regularly post your openings? (Official Q3: Where do you regularly post positions for your openings?)","slot":"{sources}","sources":["Indeed","WorkBC Job Board","our company website / careers page","LinkedIn","recruiters or staffing agencies","word of mouth and employee referrals","trade or union job boards","local colleges and training schools","social media (Facebook, Instagram)","industry associations and networks"],"templates":["We regularly post our openings on {sources}.","We advertise these positions through {sources}.","Our openings typically go out on {sources}.","We recruit for these roles mainly through {sources}.","We post positions on {sources}, and we often find qualified candidates are hard to come by.","Our hiring for these roles runs through {sources}.","We use {sources} to get our openings in front of candidates.","Openings like these are posted on {sources}.","We rely on {sources} to fill these positions.","We share our openings across {sources}.","We advertise on {sources}, though the right candidates can still be slow to come forward.","We generally post on {sources} when these roles open up.","Our usual channels for these positions are {sources}.","We put these openings out through {sources}.","We recruit through {sources}, and we've found strong local candidates in short supply.","When we're hiring for these roles we post on {sources}.","We cast a wide net using {sources}.","We list these positions on {sources}.","We promote our openings via {sources}.","We handle recruitment for these roles through {sources}.","We post on {sources}, and often re-run the same ads when qualified applicants don't come through.","Our openings reach candidates through {sources}."]},"hardToFill":{"question":"Have these positions been hard to fill in the past? If so, what made it hard? (Official Q4: Have you had a hard time filling these positions in the past? If yes, please describe the challenges you faced.) Strong answers point to a SKILLS/CREDENTIAL gap, not pay or location.","pool":["Yes, consistently. The applicants we get either have no hands-on experience or lack the specific skills and certification the role requires, so we spend months either leaving the seat empty or training from scratch. A pre-qualified cohort from this program would close exactly that gap.","Very hard. There's a real shortage of people in our area with the foundational skills this work needs — most applicants are self-taught with no recognized credential, and we can't take the risk on fully unqualified hires.","Yes. The biggest obstacle is finding candidates who already have the technical training; we get plenty of applications, but few come with the specific skills the job demands.","It's been a persistent challenge. Qualified people with this exact skill set are rare in our region, so roles stay open far longer than we'd like.","Yes — the problem isn't interest, it's readiness. Applicants often need months of training before they can contribute, and we don't always have the capacity to train from the ground up.","We struggle to find people who hold the right certification. Without a local training pipeline, we're competing for a very small pool of already-qualified workers.","Definitely. Most candidates we see lack the hands-on, job-ready skills this role requires, and we've had to turn down work because we couldn't staff it.","Yes. The gap is specifically in formal training — we meet plenty of willing people, but very few with the recognized credential and practical skills we need.","Filling these roles has been slow and difficult. The skills are specialized, the qualified candidate pool is thin, and we often end up leaning on overtime from existing staff.","Yes, repeatedly. We've left positions open for months because applicants don't have the certification or the practical experience the work requires.","It's a real bottleneck. There simply aren't enough trained people locally, so we either wait a long time or invest heavily in training someone up ourselves.","Yes. The candidates who apply typically need significant upskilling before they're productive, which stretches our team and delays projects.","We've found it very hard. The specific technical skills for this role aren't common in our area, and demand for them across the sector makes competition fierce.","Yes — we consistently see a shortage of applicants with the right credential. General experience is easy to find; this particular skill set is not.","Hard, yes. The main issue is that training for this work isn't widely available locally, so the supply of qualified candidates hasn't kept up with our need.","Yes. We've had openings sit unfilled because the applicants lacked the formal training, and bringing someone fully up to speed in-house takes time we often don't have.","It's been an ongoing struggle. Without a steady stream of trained graduates, we're left choosing between long vacancies and costly from-scratch training.","Yes. The skills gap is real — applicants are enthusiastic but under-trained, and the recognized credential this program offers is exactly what's missing.","We've had real difficulty. The specialized nature of the role means most applicants don't meet the technical bar, and the qualified few are quickly snapped up.","Yes, very much so. Our region doesn't produce enough people with this training, so we frequently reopen the same postings without finding the right fit.","Hard to fill, yes. The core problem is a lack of candidates with the specific hands-on competencies the job needs, not a lack of applicants overall.","Yes. We've relied on recruiters and still struggled, because the underlying issue is a shortage of people with the actual skills this training provides.","It's been genuinely difficult. The work requires a particular technical foundation that few local applicants have, and building it in-house is slow and expensive.","Yes. We often get applicants who are a near-miss — right attitude, wrong skill set — and a program that delivers the exact credential would change that for us.","Very hard. The talent shortage in this area is well known in our industry, and we feel it directly every time one of these roles opens up.","Yes. Finding someone job-ready has meant long searches, and more than once we've had to scale back work because the right skills weren't available locally.","It's been a consistent pain point. The specific training required isn't common, so qualified candidates are scarce and in high demand.","Yes. Most applicants need substantial training before they can do the work independently, which puts real strain on our experienced staff.","Hard, and getting harder. As demand in our sector grows, the small pool of properly trained people gets stretched thinner.","Yes. The challenge has always been the skills gap — plenty of people want the work, but few arrive with the certification and practical ability it takes.","We've found these roles very hard to staff. A local program turning out job-ready graduates would directly solve a problem we've wrestled with for years.","Yes. Repeated searches, long vacancies, and heavy reliance on training new hires from scratch — all because qualified, credentialed candidates are so hard to find here."]},"futureOpenings":{"question":"How many openings do you anticipate for these roles over the next 6 to 12 months? (Official Q5: Do you foresee future openings in these positions? If yes, how many job openings do you anticipate over the next 6 to 12 months?) {n} is the number the employer enters; show the number itself in the sentence. Count shown only when >1 where it reads naturally.","slot":"{n}","positive":["Yes. We anticipate around {n} openings in these roles over the next 6 to 12 months.","Yes — we expect roughly {n} additional openings for these positions in the coming 6 to 12 months.","We foresee about {n} openings over the next 6 to 12 months as our workload grows.","Yes. Over the next 6 to 12 months we'd estimate {n} further openings in these roles.","We expect to open approximately {n} of these positions within the next year.","Yes — our best estimate is {n} openings in these roles over the next 6 to 12 months.","We anticipate {n} or so openings for these positions in the coming months as we continue to grow.","Yes. Looking ahead 6 to 12 months, we expect around {n} openings in these roles.","We foresee roughly {n} additional positions opening over the next year.","Yes — we'd anticipate about {n} openings in these roles over the next 6 to 12 months, on top of our current needs.","We expect demand for these skills to continue, with an estimated {n} openings in the next 6 to 12 months.","Yes. Based on our pipeline, we anticipate around {n} openings in these positions over the coming year.","We'd estimate {n} further openings for these roles over the next 6 to 12 months.","Yes — as projects ramp up, we expect approximately {n} more openings in these positions within the year.","We anticipate about {n} openings over the next 6 to 12 months, and likely more beyond that.","Yes. Our forecast points to roughly {n} openings in these roles over the next 6 to 12 months.","We expect around {n} additional openings for these positions as our business grows this year.","Yes — realistically we'd expect {n} openings in these roles over the next 6 to 12 months.","We see steady demand ahead and anticipate about {n} openings in these positions within the year.","Yes. We'd put the number at around {n} openings over the next 6 to 12 months."],"negative":["We don't anticipate specific openings in the next 6 to 12 months, but these skills remain central to our work and we expect to be hiring for them again before long.","No firm openings forecast for the coming 6 to 12 months, though we see ongoing demand for these skills and would welcome qualified graduates as our needs develop.","We can't point to a specific number yet, but roles like these turn over and expand for us over time, and we expect future opportunities.","No additional openings projected right now, but we're optimistic about growth and anticipate needing these skills down the line.","We don't have a forecast number for the next year, but the demand for these skills in our sector is steady and we expect to hire again as we grow.","Nothing firmly projected for the coming months, though we'd expect openings to arise as projects and workload pick up.","No specific future openings to report yet, but these are skills we return to regularly, and a local pool of graduates would be valuable as our needs evolve.","We're not forecasting set numbers for the next 6 to 12 months, but we anticipate continued demand and would welcome qualified graduates when roles open.","No concrete projection at this stage, but given where our sector is heading we expect openings in these roles before long.","We can't commit to a number for the coming year, but we see these skills staying in demand and expect to be recruiting for them in future."]},"practicum":{"question":"If a practicum were part of the training, could you host a student? If so, how many? (Official Q6: As a part of training, if a practicum was required, are you providing a practicum space? If so, how many placements?) NOTE: this is purely hypothetical — the program does NOT include a placement — so answers are about willingness, not a commitment. 'positive' uses {n} = number of placements (count shown only when >1 where natural). 'negative' answers are an honest 'not right now' that still reads supportive and real.","slot":"{n}","positive":["Yes, in principle we could host {n}. We'd see a practicum as a great way to give students real experience and get to know potential future hires.","We'd be open to hosting {n}. Hands-on placements are exactly how people learn this work, and we'd be glad to help.","Yes — we could likely make room for {n}, subject to the usual approvals. We think practical experience is invaluable for new entrants.","In principle, yes, around {n}. We'd want to give students meaningful project work rather than just observation.","We'd happily consider {n}. Mentoring newcomers is something our team genuinely enjoys and values.","Yes, we could probably accommodate {n} if the timing worked. A practicum is a natural pipeline into the roles we hire for.","We'd be willing to take {n}. Real worksite experience makes a big difference in how job-ready graduates are.","Yes — potentially {n}, pending management sign-off. We see placements as an investment in the local talent pool.","We could look at hosting {n}. Pairing a student with an experienced team member is how we'd approach it.","In theory, yes, {n}. We'd treat it as a two-way opportunity — experience for them, a look at fresh talent for us.","We'd be glad to host {n}. Giving people a first real foothold in the industry matters to us.","Yes, {n} would be realistic for us. We'd make sure they got proper supervision and genuine work to do.","We'd consider {n}, workload permitting. A practicum is often where we spot people we'd want to hire.","Potentially {n}. We believe strongly in hands-on training and would want to support it where we can.","Yes — we could offer {n} and provide the mentorship and equipment to make it worthwhile.","We'd aim to host {n} if we could. Practical placements are how this trade has always passed on its skills.","In principle {n}, and we'd want to make it a real learning experience, not just job-shadowing.","Yes, {n} sounds doable for us. Supporting the next generation of skilled workers is something we care about.","We'd be open to {n}, subject to approval. We've seen first-hand how much placements accelerate someone's readiness.","We could likely host {n}. We'd see it as giving back to the local industry we rely on.","Yes — around {n}. We'd pair each student with a senior staff member so they get proper guidance.","We'd welcome {n} if the opportunity arose. Real experience on live projects is the best teacher in our field.","In theory we could take {n}, and we'd be glad to — it's exactly the kind of community support we believe in.","Yes, {n} is something we could work toward. We'd want to make sure the experience genuinely helps them grow.","We'd consider hosting {n}, and we'd treat it seriously — meaningful tasks, real feedback, proper supervision.","Potentially {n}, depending on project load. We think practicums are one of the best ways into this industry.","Yes — we could make space for {n} and would see it as part of building a stronger local workforce.","We'd be happy to explore {n}. Giving students a real taste of the work benefits everyone in the long run.","In principle, {n}. We'd want them learning from our most experienced people and leaving genuinely more employable.","Yes, {n} feels realistic. We'd approach it as a proper mentorship, not just a box to tick.","We could host {n} if asked. Practical placements are how we'd most like to support training like this.","We'd aim for {n}, and we'd make the experience count — real responsibilities and the support to handle them."],"negative":["Not at the moment, but we think practicums are a great idea and would want to revisit it as our capacity allows.","We're not set up to host a placement right now, but we'd genuinely like to in the future — hands-on experience is so valuable.","Not currently, though we'd be glad to consider it down the road. We really value this kind of practical training.","We can't offer a placement at this time, but we fully support the idea and hope to be in a position to help later.","Not right now — our team is stretched — but we think placements are exactly what new entrants need and we'd like to contribute eventually.","We're unable to host just now, but we'd welcome the chance as things settle. Real experience makes all the difference.","Not at present, but this is something we'd love to do once we have the capacity to mentor properly.","We can't commit to a space currently, though we strongly believe in work-integrated learning and would revisit it.","Not this time, but we'd keep the door open — supporting students into the trade is something we care about.","We're not able to right now, but we think it's a worthwhile idea and would consider it in future intakes.","Not currently, but we'd genuinely like to help with placements once our workload allows.","We can't host at the moment, but we see the value clearly and hope to take part when we're able.","Not right now, though we'd happily look at it later — giving people real experience is how this industry grows.","We're not in a position to this time, but we'd encourage it and would love to be involved down the line.","Not at this stage, but we think practicums are important and would aim to offer one in the future.","We can't just now, but we'd welcome a conversation about it later — we really do see the benefit.","Not currently, but we admire the idea and would like to support placements once we have the bandwidth.","We're unable to host at present, though we'd be keen to as soon as our capacity allows.","Not this intake, but we'd genuinely like to help with hands-on training in the future.","We can't offer a space right now, but we fully back the concept and hope to contribute before long.","Not at the moment, but supporting new talent through placements is something we'd want to do when we can.","We're not able to this time around, but we think it's a great initiative and would revisit it gladly."]},"comments":{"question":"Anything else you'd like to add? (Official Q7: Do you wish to add any further comments?) Optional. Strong answers reinforce that this is a real local skills shortage the training would address, and that the employer is a genuine, invested community partner. Positive and aligned with what CWRG wants to hear.","pool":["The skills shortage in our sector has been one of our biggest constraints on growth, and training like this is exactly what's needed to address it locally.","We fully support this application. A steady supply of qualified local graduates would make a real difference to businesses like ours.","We've seen first-hand how hard it is to find people with these specific skills, and a dedicated training program would directly help close that gap.","This training targets a genuine need in our industry. We'd gladly prioritize interviewing its graduates for our openings.","Programs like this are how our sector sustains itself. We're glad to see local training that produces job-ready people.","We believe strongly in building talent close to home, and this training would strengthen the whole local workforce, not just our own hiring.","The lack of trained candidates has held our region back, and we see this program as a practical, much-needed response to that.","We'd welcome graduates of this program and are happy to support it in any way we can. The need is real and ongoing.","Training like this keeps skilled work in our community rather than forcing employers to look elsewhere. We're fully behind it.","We've had to turn down work for lack of qualified staff, so a local pipeline of trained graduates would have a direct, positive impact.","This is exactly the kind of initiative our industry needs. We're pleased to lend our support to the application.","A credentialed, job-ready cohort would be a genuine asset to employers across our sector, and we're glad to see it being developed here.","We see this training as an investment in the long-term health of our local economy, and we support it wholeheartedly.","The demand for these skills isn't going away, and homegrown training is the most sustainable way to meet it. We're happy to help.","We'd be glad to stay involved as this program develops — whether through hiring, mentorship, or feedback on what employers need.","This kind of training makes our region a more attractive place to do business, and we're pleased to support it.","We strongly endorse this application. Local, practical, credential-based training is precisely what our sector has been missing.","Graduates of programs like this tend to be noticeably more job-ready, and that readiness is exactly what we struggle to find.","We appreciate efforts to build local skills capacity and would welcome the chance to hire from this program's graduates.","The gap between the skills we need and the candidates available is real, and this training is a direct, sensible way to narrow it.","We're glad to support training that keeps opportunity and talent within our own communities.","This program addresses a shortage we feel every time we try to hire, and we'd be pleased to see it succeed.","We'd happily serve as a reference for the value of this training — the need for it in our sector is clear and pressing.","Supporting this application was an easy decision. A stronger local talent pool benefits everyone in our industry.","We see real, lasting demand for these skills, and locally delivered training is the best way to meet it. We're fully supportive.","Initiatives like this help smaller employers compete for talent, and we're grateful to see investment in local skills.","We back this program and would encourage its graduates to apply with us. The industry genuinely needs more trained people.","This training reflects exactly where our sector is heading, and we're glad the region is building capacity to keep up.","We'd welcome a continued relationship with this program — the alignment between what it teaches and what we need is strong.","The practical focus of this training is what sets it apart, and it's precisely that hands-on readiness our workplaces require.","We fully support this effort to grow local skills, and we believe it will pay off for employers, graduates, and the community alike.","This is a worthwhile and timely initiative. We're pleased to support it and look forward to the talent it will produce."]}}}</script>
<script>

(function () {
  "use strict";
  var CFG = JSON.parse(document.getElementById("program-config").textContent);
  var STORAGE_KEY = "cwrg_" + location.pathname;

  var ICON = {
    good: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    warn: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M8 1.5L15 14H1L8 1.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 6v3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.6" r=".9" fill="currentColor"/></svg>'
  };
  function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
  function el(id){ return document.getElementById(id); }
  function words(s){ return (s.trim().match(/\S+/g)||[]).length; }
  // pick up to n distinct random items from arr (order randomized)
  function pickN(arr, n){
    var a = (arr||[]).slice();
    for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a.slice(0, Math.max(0, n));
  }

  /* ---- top subtitle ---- */
  el("topSub").textContent = CFG.programTitle + " · " + CFG.college;

  /* ---- intro ---- */
  var intro = CFG.intro || {};
  el("intro").innerHTML =
    '<div class="intro-top">' +
      (intro.badge ? '<span class="intro-badge">' + esc(intro.badge) + '</span>' : '') +
      (intro.timeEstimate ? '<span class="intro-time">\u23f1\ufe0f ' + esc(intro.timeEstimate) + '</span>' : '') +
    '</div>' +
    (intro.heading ? '<h2>' + esc(intro.heading) + '</h2>' : '') +
    (intro.builtByHtml ? '<p class="collab">' + intro.builtByHtml + '</p>' : '') +
    (intro.goalHtml ? '<p class="goal">' + intro.goalHtml + '</p>' : '') +
    '<div class="note reassure"><span class="pill">No hiring commitment</span><div>' + (CFG.notCommittedNote||'') + '</div></div>' +
    '<dl class="baked">' +
      '<dt>Program</dt><dd>' + esc(CFG.programTitle) + '</dd>' +
      '<dt>Credential</dt><dd>' + esc(CFG.credential) + '</dd>' +
      '<dt>In partnership with</dt><dd>' + esc(CFG.college) + '</dd>' +
    '</dl>' +
    '<div class="progress-wrap"><div class="progress-label"><span>Your progress</span><span id="progressPct">0%</span></div>' +
    '<div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div>';

  el("footnote").innerHTML = CFG.footerNote || '';

  /* ---- build fields ---- */
  var form = el("form");
  var sec = document.createElement("div"); sec.className = "section";
  sec.innerHTML = '<div class="section-head"><h3>A few questions about your employment needs</h3></div>';
  var body = document.createElement("div"); body.className = "section-body";
  sec.appendChild(body); form.appendChild(sec);

  var qIndex = 0;
  CFG.questions.forEach(function(q){
    qIndex++;
    var f = document.createElement("div");
    f.className = "field"; f.dataset.qid = q.id; f.dataset.type = q.type;
    if (q.optional) f.dataset.optional = "1";

    var optLabel = q.optional ? ' <span class="opt">(optional)</span>' : ' <span class="req">*</span>';
    var head = '<label class="q" for="' + q.id + '"><span class="num">' + qIndex + '</span>' + esc(q.label) + optLabel + '</label>' +
               (q.hint ? '<div class="hint">' + esc(q.hint) + '</div>' : '');

    var hasPool = !!((q.suggestions && q.suggestions.length) ||
      (CFG.phrasings && CFG.phrasings[q.id] && CFG.phrasings[q.id].pool && CFG.phrasings[q.id].pool.length));
    var control = "";
    if (q.type === "textarea") {
      var ph = q.placeholder != null
        ? q.placeholder
        : (hasPool
            ? "Write your answer here…"
            : "Write your answer here…");
      control = '<textarea id="' + q.id + '" rows="3" placeholder="' + esc(ph) + '"></textarea>';
    } else if (q.type === "text") {
      var phT = q.placeholder != null ? q.placeholder : "Write your answer here…";
      control = '<input type="text" id="' + q.id + '" placeholder="' + esc(phT) + '">';
    } else if (q.type === "number") {
      control = numberControl(q);
    } else if (q.type === "roles") {
      control = rolesControl(q);
    } else if (q.type === "rolegrid") {
      control = roleGridControl(q);
    } else if (q.type === "sourcegrid") {
      control = sourceGridControl(q);
    } else if (q.type === "countanswer") {
      control = countAnswerControl(q);
    } else if (q.type === "practicum") {

    }

      v += (e.key==="ArrowUp"?step:-step);

  // suggestions — insert when empty; if the field already has text, ask before replacing

  /* ---- role-grid (Question 2): steppers + custom rows + "none" toggle + auto-answer ---- */
  function rgClamp(v){ v = parseInt(v,10); if(isNaN(v)||v<0) v=0; return Math.min(99, v); }
  // gather [{name, count}] for a role-grid question (only rows with a name and count>0)
  function rgRoles(qid){

  function pluralize(name){
    if (/s$/i.test(name)) return name;                 // already plural-ish
    if (/(ch|sh|x|z)$/i.test(name)) return name + "es";
    if (/[^aeiou]y$/i.test(name)) return name.replace(/y$/i, "ies");
    return name + "s";
  }
  // natural-prose list: "2 Estimators, a BIM Designer, and 3 CAD Technicians"
  function rolesPhrase(list){
    var parts = list.map(function(r){
      if (r.count > 1) return r.count + " " + pluralize(r.name);
      var article = /^[aeiou]/i.test(r.name) ? "an " : "a ";
      return article + r.name;
    });
    if (parts.length === 1) return parts[0];
    if (parts.length === 2) return parts[0] + " and " + parts[1];
    return parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1];
  }
  function pick(arr){ return arr && arr.length ? arr[Math.floor(Math.random()*arr.length)] : ""; }

      return tmpl.replace(/\{roles\}/g, rolesPhrase(list));

    return "";

  // write a fresh generated answer into the box (unless the employer has hand-edited it)

    if (!hasBasis){ if (!box.dataset.edited){ box.value=""; } validateRoleGrid(qid); recompute(); return; }
    // only auto-overwrite if the employer hasn't manually edited the text

  document.querySelectorAll('[data-rolegrid]').forEach(function(grid){

      });
      input.addEventListener('input', function(){ touched[qid]=true; input.value = input.value.replace(/[^0-9]/g,''); rgRefresh(qid); });
      input.addEventListener('blur', function(){ input.value = rgClamp(input.value); rgRefresh(qid); });

  /* ---- source-grid (Question 3): checklist + custom + auto-answer ---- */
  function sgSources(qid){
    var list = [];
    document.querySelectorAll('#'+qid+' .src-check:checked').forEach(function(cb){ if(list.indexOf(cb.value)===-1) list.push(cb.value); });

  function sgGenerate(qid){
    var pool = (CFG.phrasings && CFG.phrasings[qid]) || {};
    var list = sgSources(qid);

  function sgRefresh(qid, force){

  /* ---- count-answer (Question 5): single stepper + "none" toggle + auto-answer ---- */
  function caValue(qid){ var e=el(qid+'_n'); var v=parseInt(e?e.value:'',10); return isNaN(v)?0:Math.max(0,v); }
  function caNone(qid){ var c=el(qid+'_none'); return !!(c && c.checked); }
  function caGenerate(qid){
    var pool = (CFG.phrasings && CFG.phrasings[qid]) || {};
    var n = caValue(qid);
    if (n > 0){
      var tmpl = pick(pool.positive) || "Yes — we anticipate about {n} openings over the next 6 to 12 months.";
      return tmpl.replace(/\{n\}/g, n);
    }
    if (caNone(qid)){
      return pick(pool.negative) || "No specific number yet, but we expect to need these skills as we grow.";
    }
    return "";
  }
  function caRefresh(qid, force){
    var box = el(qid+'_answer'); if(!box) return;
    clearRestored(qid);
    var regenBtn = document.querySelector('[data-ca-regen="'+qid+'"]');
    var n = caValue(qid), none = caNone(qid);
    var hasBasis = n > 0 || none;
    if (regenBtn) regenBtn.hidden = !hasBasis;
    if (!hasBasis){ if(!box.dataset.edited) box.value=""; validateCountAnswer(qid); recompute(); return; }
    if (force || (!box.dataset.edited && !box.dataset.restored)){ box.value = caGenerate(qid); }
    autogrow(box); validateCountAnswer(qid); recompute();
  }
  document.querySelectorAll('[data-countanswer]').forEach(function(ca){
    var qid = ca.getAttribute('data-countanswer');
    var st = ca.querySelector('.ca-step'), input = st.querySelector('input');

    st.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){ touched[qid]=true; input.value = clamp((+input.value||0) + step*(+b.dataset.stepDir)); caRefresh(qid); });
    });
    input.addEventListener('input', function(){ touched[qid]=true; input.value = input.value.replace(/[^0-9]/g,''); caRefresh(qid); });
    input.addEventListener('blur', function(){ input.value = clamp(input.value); caRefresh(qid); });
    wireStepperKeys(input, 0, max, step, function(){ touched[qid]=true; caRefresh(qid); });
    var none = el(qid+'_none');
    if (none) none.addEventListener('change', function(){ touched[qid]=true; caRefresh(qid, true); });
    var box = el(qid+'_answer');
    if (box) box.addEventListener('input', function(){ box.dataset.edited="1"; touched[qid]=true; autogrow(box); validateCountAnswer(qid); recompute(); });
    var regen = document.querySelector('[data-ca-regen="'+qid+'"]');
    if (regen) regen.addEventListener('click', function(){ if(box) delete box.dataset.edited; caRefresh(qid, true); if(box) box.focus(); });

  // roles — preset checkboxes
  document.querySelectorAll(".role input").forEach(function(cb){
    cb.addEventListener("change", function(){
      var holder = cb.closest("[data-roles]");

  /* ---- practicum (Question 6): yes/no + count (if yes) + auto-generated answer ---- */
  function prYN(qid){ var r=document.querySelector('input[name="'+qid+'_yn"]:checked'); return r?r.value:""; }
  function prCount(qid){ var e=el(qid+'_count'); var v=parseInt(e?e.value:'',10); return isNaN(v)?1:Math.max(1,v); }
  function prGenerate(qid){
    var pool = (CFG.phrasings && CFG.phrasings[qid]) || {};
    var yn = prYN(qid);
    if (yn === "yes"){
      var tmpl = pick(pool.positive) || "Yes, in principle we could host {n}.";
      var n = prCount(qid);
      var nPhrase = (n > 1) ? (n + " students") : "a student";
      return tmpl.replace(/\{n\}/g, nPhrase);
    }
    if (yn === "no"){
      return pick(pool.negative) || "Not at this time, but we think placements are a great idea and would revisit it.";
    }
    return "";
  }
  function prRefresh(qid, force){
    var box = el(qid+'_answer'); if(!box) return;

    if (!hasBasis){ if(!box.dataset.edited) box.value=""; validatePracticum(qid); recompute(); return; }
    if (force || (!box.dataset.edited && !box.dataset.restored)){ box.value = prGenerate(qid); }

  document.querySelectorAll("[data-practicum]").forEach(function(pr){
    var qid = pr.id;

      });

    // count stepper (only relevant when "yes")

      st.querySelectorAll('button').forEach(function(b){
        b.addEventListener('click', function(){ touched[qid]=true; input.value = clamp((+input.value||1) + step*(+b.dataset.stepDir)); prRefresh(qid); });
      });
      input.addEventListener('input', function(){ touched[qid]=true; input.value=input.value.replace(/[^0-9]/g,''); prRefresh(qid); });
      input.addEventListener('blur', function(){ input.value = clamp(input.value); prRefresh(qid); });

    var regen = document.querySelector('[data-pr-regen="'+qid+'"]');

  /* ---- validation + progress ---- */
  var contactFields = [].slice.call(document.querySelectorAll('[data-contact="1"]'));

  function setFb(fb, kind, msg){ fb.className = "feedback" + (kind?" "+kind:""); fb.innerHTML = msg ? ((ICON[kind]||"")+"<span>"+esc(msg)+"</span>") : ""; }

  function validateContact(f){
    var input = f.querySelector("input"), fb = f.querySelector(".feedback"), v = input.value.trim();
    if (!v){ setFb(fb,"",""); return false; }
    if (f.dataset.kind === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ setFb(fb,"warn","That doesn't look like a complete email."); return false; }
    if (f.dataset.kind === "tel" && v.replace(/\D/g,"").length < 10){ setFb(fb,"warn","Please include a full 10-digit phone number."); return true; }
    var min = +(f.dataset.min||0);
    if (min && v.length < min){ setFb(fb,"warn","A little more detail helps."); return true; }
    setFb(fb,"good","Looks good."); return true;
  }
  function validateQ(q){
    var input = el(q.id), f = input.closest(".field"), fb = f.querySelector(".feedback"), v = input.value.trim();
    if (q.optional){ setFb(fb, v?"good":"", v?"Thanks for the detail.":""); return true; }
    if (!v){ setFb(fb,"",""); return false; }
    if (words(v) < 4 || v.length < 18){ setFb(fb,"warn","Try to be a bit more specific — it makes a stronger case."); return true; }
    setFb(fb,"good","Great — clear and specific."); return true;
  }
  function fieldFb(id){ var f = el(id).closest(".field"); return f ? f.querySelector(".feedback") : null; }
  function validateRoles(id){
    var fb = fieldFb(id); if(!fb) return;
    var n = collectRoles(id).length;
    if (!touched[id] && n===0){ setFb(fb,"",""); return; }

    else setFb(fb,"good", n + " role" + (n===1?"":"s") + " listed.");
  }
  function validateRoleGrid(id){
    var fb = fieldFb(id); if(!fb) return;
    var list = rgRoles(id), none = rgNone(id);
    if (!touched[id] && list.length===0 && !none){ setFb(fb,"",""); return; }
    if (list.length === 0 && !none){ setFb(fb,"warn","Set a number beside a role, or tick “No vacancies right now”."); return; }
    if (list.length > 0){
      var total = list.reduce(function(s,r){return s+r.count;},0);
      setFb(fb,"good", total + " position" + (total===1?"":"s") + " across " + list.length + " role" + (list.length===1?"":"s") + ".");
    } else {
      setFb(fb,"good","Noted — we'll record your interest for the future.");
    }
  }
  function validateSourceGrid(id){
    var fb = fieldFb(id); if(!fb) return;
    var n = sgSources(id).length;
    if (!touched[id] && n===0){ setFb(fb,"",""); return; }
    if (n===0){ setFb(fb,"warn","Tick at least one place you post, or add your own."); return; }
    setFb(fb,"good", n + " source" + (n===1?"":"s") + " selected.");
  }
  function validateCountAnswer(id){
    var fb = fieldFb(id); if(!fb) return;

    if (!touched[id] && n===0 && !none){ setFb(fb,"",""); return; }
    if (n===0 && !none){ setFb(fb,"warn","Set a number, or tick “No specific number yet”."); return; }

  function validateNumber(q){
    var fb = fieldFb(q.id); if(!fb) return;

    setFb(fb,"good","Got it.");
  }

  function isQuestionFilled(q){
    if (q.optional) return true;
    if (q.type === "textarea" || q.type === "text") return !!el(q.id).value.trim();
    if (q.type === "number") return !!touched[q.id];            // must be deliberately set (0 is valid, but only once touched)
    if (q.type === "roles") return collectRoles(q.id).length > 0;
    if (q.type === "rolegrid" || q.type === "sourcegrid" || q.type === "countanswer") return !!(el(q.id+"_answer") && el(q.id+"_answer").value.trim());
    if (q.type === "practicum") { return !!(el(q.id+"_answer") && el(q.id+"_answer").value.trim()); }
    return true;
  }

  // is the email filled and well-formed? (the one validity that blocks submit)
  function emailOk(){
    var v = (el("repEmail").value||"").trim();
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
  }
  var formComplete = false;
  // return the DOM element of the first incomplete required field, or null
  function firstIncomplete(){
    for (var i=0;i<CFG.questions.length;i++){ var q = CFG.questions[i];
      if (!q.optional && !isQuestionFilled(q)) return el(q.id).closest(".field");
    }
    for (var j=0;j<requiredContacts.length;j++){
      var f = requiredContacts[j], v = f.querySelector("input").value.trim();
      if (!v) return f;
      if (f.dataset.kind === "email" && !emailOk()) return f;  // present but malformed
    }
    if (!el("certify").checked) return el("certify").closest(".field");
    return null;
  }
  function recompute(){
    var req = [], done = 0;
    CFG.questions.forEach(function(q){ if(!q.optional){ req.push(q); if(isQuestionFilled(q)) done++; } });
    var total = req.length + requiredContacts.length + 1; // +certify
    requiredContacts.forEach(function(f){
      var v = f.querySelector("input").value.trim();
      if (!v) return;
      if (f.dataset.kind === "email" && !emailOk()) return; // malformed email doesn't count as done
      done++;
    });
    if (el("certify").checked) done++;

    var pct = Math.round(done/total*100);
    el("progressFill").style.width = pct + "%";
    el("progressPct").textContent = pct + "%";
    formComplete = done >= total;
    // keep the button clickable so an incomplete click can guide the user; show state via class + aria
    el("downloadBtn").classList.toggle("is-ready", formComplete);
    el("downloadBtn").setAttribute("aria-disabled", formComplete ? "false" : "true");
    var left = total - done;
    el("statusMsg").className = "status-msg" + (formComplete?" done":"");
    el("statusMsg").textContent = formComplete ? "All set — download your completed PDF." : (left + " question" + (left===1?"":"s") + " left.");
    saveDraft();
  }

  /* ---- draft autosave ---- */
  function saveDraft(){
    try {
      var d = { v:{}, roles:{}, radios:{}, checks:{}, edited:{} };
      d.srcChecks = {};  // source-grid checkboxes keyed by "<qid>::<value>"
      form.querySelectorAll("input, textarea").forEach(function(e){
        if (e.type === "checkbox"){
          if (e.id==="certify") d.v.certify = e.checked;
          else if (e.classList.contains("src-check")){ d.srcChecks[e.getAttribute("data-sg")+"::"+e.value] = e.checked; }
          else if (e.closest(".roles")) d.roles[e.value] = e.checked;
          else if (e.id) d.checks[e.id] = e.checked;   // e.g. role-grid "no openings"
        }
        else if (e.type === "radio"){ if (e.checked) d.radios[e.name] = e.value; }
        else if (e.id) d.v[e.id] = e.value;
      });
      // remember which grid answer boxes the employer hand-edited
      document.querySelectorAll("[data-rg-answer], [data-sg-answer], [data-ca-answer], [data-pr-answer]").forEach(function(b){ if(b.dataset.edited) d.edited[b.id]=1; });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(d));
    } catch(e){}
  }
  function loadDraft(){
    try {
      var raw = localStorage.getItem(STORAGE_KEY); if(!raw) return;
      var d = JSON.parse(raw);
      Object.keys(d.v||{}).forEach(function(id){ if(id==="certify"){ el("certify").checked=!!d.v.certify; return;} var e=el(id); if(e) e.value=d.v[id]; });
      // restore roles and mark the roles question touched if any was saved
      document.querySelectorAll(".role input").forEach(function(cb){
        if(d.roles && d.roles[cb.value]){ cb.checked=true; cb.closest(".role").classList.add("checked"); var h=cb.closest("[data-roles]"); if(h) touched[h.id]=true; }
      });
      // restore hand-edit flags FIRST, and mark saved answer boxes as "restored" so the
      // init-time refreshers below don't overwrite their wording (A1/A2 fix)
      Object.keys(d.edited||{}).forEach(function(id){ var b=el(id); if(b) b.dataset.edited="1"; });
      document.querySelectorAll("[data-rg-answer],[data-sg-answer],[data-ca-answer],[data-pr-answer]").forEach(function(b){
        if ((b.value||"").trim()) b.dataset.restored="1";
      });
      // restore generic checkboxes (role-grid / count "no openings") BEFORE re-firing radios
      Object.keys(d.checks||{}).forEach(function(id){ var c=el(id); if(c) c.checked=!!d.checks[id]; });
      // restore radios (practicum) and re-fire change so the conditional UI re-applies
      Object.keys(d.radios||{}).forEach(function(name){
        var r=document.querySelector('input[name="'+name+'"][value="'+d.radios[name]+'"]');
        if(r){ r.checked=true; r.dispatchEvent(new Event("change",{bubbles:true})); }
      });
      // a restored number value means it was deliberately set before — mark touched
      CFG.questions.forEach(function(q){ if(q.type==="number" && d.v && d.v[q.id]!=null && d.v[q.id]!=="") touched[q.id]=true; });
      // a restored "other roles" value also counts as touching the roles question
      CFG.questions.forEach(function(q){ if(q.type==="roles" && d.v && (d.v[q.id+"_other"]||"").trim()) touched[q.id]=true; });
      CFG.questions.forEach(function(q){
        if(q.type!=="rolegrid") return;
        var answered = (d.v && (d.v[q.id+"_answer"]||"").trim());
        var noneOn = d.checks && d.checks[q.id+"_none"];
        if (answered || noneOn) touched[q.id]=true;
      });
      // restore source-grid checkboxes + checked styling, and mark touched
      document.querySelectorAll(".src-check").forEach(function(cb){
        var key = cb.getAttribute("data-sg")+"::"+cb.value;
        if (d.srcChecks && d.srcChecks[key]){ cb.checked=true; cb.closest(".src-item").classList.add("checked"); touched[cb.getAttribute("data-sg")]=true; }
      });
      CFG.questions.forEach(function(q){
        if(q.type!=="sourcegrid") return;
        if (d.v && (d.v[q.id+"_answer"]||"").trim()) touched[q.id]=true;
      });
      // count-answer: a restored number, answer, or "none" toggle means it was touched
      CFG.questions.forEach(function(q){
        if(q.type!=="countanswer") return;
        var hasN = d.v && d.v[q.id+"_n"]!=null && d.v[q.id+"_n"]!=="" && d.v[q.id+"_n"]!=="0";
        var answered = d.v && (d.v[q.id+"_answer"]||"").trim();
        var noneOn = d.checks && d.checks[q.id+"_none"];
        if (hasN || answered || noneOn) touched[q.id]=true;
      });
      // practicum: restored yes/no or answer means touched; show the answer wrap
      CFG.questions.forEach(function(q){
        if(q.type!=="practicum") return;
        var yn = d.radios && d.radios[q.id+"_yn"];
        var answered = d.v && (d.v[q.id+"_answer"]||"").trim();
        if (yn || answered) touched[q.id]=true;
        var wrap = document.querySelector('[data-pr-answerwrap="'+q.id+'"]'); if(wrap && (yn||answered)) wrap.hidden=false;
      });
      // the radio re-fire above may have regenerated grid/practicum answers with force;
      // re-apply any saved answer text the employer had (so edits and prior wording survive a reload)
      Object.keys(d.v||{}).forEach(function(id){
        if (/_answer$/.test(id)){ var b=el(id); if(b && (d.v[id]||"").length) b.value=d.v[id]; }
      });
    } catch(e){}
  }
  loadDraft();
  contactFields.forEach(validateContact);
  CFG.questions.forEach(function(q){
    if(q.type==="textarea"||q.type==="text") validateQ(q);
    else if(q.type==="roles") validateRoles(q.id);
    else if(q.type==="rolegrid") rgRefresh(q.id);
    else if(q.type==="sourcegrid") sgRefresh(q.id);
    else if(q.type==="countanswer") caRefresh(q.id);
    else if(q.type==="practicum") prRefresh(q.id);
    else if(q.type==="number") validateNumber(q);
  });
  recompute();
  initializing = false;  // from here on, user interactions regenerate restored wording

  /* ---- reset ---- */
  el("resetBtn").addEventListener("click", function(){
    if(!window.confirm("Clear all your answers? This can't be undone.")) return;
    form.querySelectorAll("input, textarea").forEach(function(e){
      if(e.type==="checkbox"||e.type==="radio") e.checked=false; else e.value="";

    touched = {};

    document.querySelectorAll("[data-sourcegrid]").forEach(function(g){ sgRefresh(g.getAttribute("data-sourcegrid")); });
    document.querySelectorAll("[data-countanswer]").forEach(function(g){ caRefresh(g.getAttribute("data-countanswer")); });
    document.querySelectorAll("[data-practicum]").forEach(function(g){ prRefresh(g.id); });

  /* ================= PDF ================= */
  // If incomplete, guide the employer to the first missing field instead of generating.
  el("downloadBtn").addEventListener("click", function(){
    if (!formComplete){
      var f = firstIncomplete();
      if (f){
        var input = f.querySelector("input, textarea, [data-roles], .yesno");

        var fb = f.querySelector(".feedback");

    generatePDF();
